# Compiles Earshot for macOS and runs the editor tests on every push and pull request.
# Pushing a tag like v1.2.0 (matching VERSION) also publishes a GitHub Release with the disk image,
# using the hand-written notes in docs/releases/<version>.md (the build fails if that file is missing).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # Apple Silicon. The app targets macOS 26.4 and uses FoundationModels, so it needs that SDK or newer.
    permissions:
      contents: read
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number is the commit count, so it needs the whole history

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          command -v cmake >/dev/null || brew install cmake
          cmake --version | head -1

      # whisper-cli and the sherpa-onnx libraries the app bundles (ADR-2611141800). vendor.sh pins
      # every version, so its hash is the cache key; a cache hit skips the ~1 minute whisper.cpp build.
      - uses: actions/cache@v4
        with:
          path: EarshotApp/.vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('EarshotApp/vendor.sh') }}

      - name: Vendor the native tools
        run: bash EarshotApp/vendor.sh

      - name: Version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match VERSION ($version)"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && ! -f "docs/releases/$version.md" ]]; then
            echo "::error::Missing release notes: docs/releases/$version.md"
            exit 1
          fi

      # Releases are signed with Developer ID and notarized, so the DMG opens with a double-click
      # (ADR-2611141600). A tag build without the secrets fails here instead of shipping an app that
      # Gatekeeper blocks. Branch and pull-request builds stay ad hoc and need no secrets.
      - name: Import the Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$DEVELOPER_ID_P12" || -z "$DEVELOPER_ID_P12_PASSWORD" ]]; then
            echo "::error::Release builds need the DEVELOPER_ID_P12 and DEVELOPER_ID_P12_PASSWORD secrets (see docs/DEVELOPMENT.md, Signing and notarization)"
            exit 1
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(uuidgen)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [[ -z "$identity" ]]; then
            echo "::error::DEVELOPER_ID_P12 holds no Developer ID Application identity"
            exit 1
          fi
          echo "EARSHOT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and package Earshot.app
        run: bash EarshotApp/build.sh

      - name: Run tests
        run: bash EarshotApp/Tests/run.sh

      - name: Make the disk image
        run: bash EarshotApp/make-dmg.sh "$HOME/Applications/Earshot.app"

      - name: Notarize the disk image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$NOTARY_KEY_P8" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "::error::Release builds need the NOTARY_KEY_P8, NOTARY_KEY_ID and NOTARY_ISSUER_ID secrets (see docs/DEVELOPMENT.md, Signing and notarization)"
            exit 1
          fi
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          bash EarshotApp/notarize.sh Earshot-*.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: Earshot-${{ steps.version.outputs.version }}
          path: Earshot-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@v8
        with:
          name: Earshot-${{ needs.macos.outputs.version }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Earshot-*.dmg --repo "$GITHUB_REPOSITORY" \
            --title "Earshot ${{ needs.macos.outputs.version }}" \
            --notes-file "docs/releases/${{ needs.macos.outputs.version }}.md"

  # The Homebrew cask (ADR-2611141900): github.com/gaberger/homebrew-earshot gets Casks/earshot.rb for
  # this release, with the SHA-256 of the DMG just published. HOMEBREW_TAP_TOKEN is a fine-grained
  # token with Contents: read and write on that one repository. Runs after the release is out, so a
  # failure here leaves the release intact and shows as a red job to fix.
  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/update-cask
            packaging/homebrew

      - uses: actions/download-artifact@v8
        with:
          name: Earshot-${{ needs.macos.outputs.version }}

      - name: Update the cask in the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.macos.outputs.version }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::The HOMEBREW_TAP_TOKEN secret is missing, so the cask was not updated (see docs/DEVELOPMENT.md)"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/gaberger/homebrew-earshot.git" tap
          mkdir -p tap/Casks
          bash scripts/update-cask "$VERSION" "Earshot-$VERSION.dmg" tap/Casks/earshot.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/earshot.rb
          git diff --cached --quiet && { echo "cask already at $VERSION"; exit 0; }
          git commit -m "earshot $VERSION"
          git push origin HEAD
